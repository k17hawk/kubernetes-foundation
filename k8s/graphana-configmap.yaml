apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: flask-mysql
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
    - name: Prometheus
      type: prometheus
      url: http://prometheus.flask-mysql.svc.cluster.local:9090
      access: proxy
      isDefault: true
      editable: true