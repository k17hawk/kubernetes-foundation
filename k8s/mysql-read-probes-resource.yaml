apiVersion: v1
kind: Service
metadata:
  name: mysql-replica
  namespace: flask-mysql
spec:
  ports: 
  - port: 3306
  clusterIP: None
  selector:
    app: mysql-replica-stateful
    role: replica
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mysql-replica-sa
  namespace: flask-mysql
  labels:
    app: mysql-replica
    role: replica
---
apiVersion: apps/v1
kind: StatefulSet
metadata: 
  name: mysql-replica
  namespace: flask-mysql
spec:
  replicas: 2
  serviceName: mysql-replica
  selector:
    matchLabels:
      app: mysql-replica-stateful
      role: replica
  template:
    metadata:
      labels: 
        app: mysql-replica-stateful  
        role: replica
    spec:
      serviceAccountName: mysql-replica-sa  # ← MOVED: This belongs in template.spec
      initContainers:
      - name: wait-for-primary
        image: busybox:1.35
        command: ['sh', '-c', 'until nslookup mysql-primary.flask-mysql.svc.cluster.local; do echo waiting for mysql-primary; sleep 2; done']
      containers:
        - name: mysql
          image: bitnamilegacy/mysql:8.0.39-debian-12-r0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_REPLICATION_MODE
              value: "slave"
            - name: MYSQL_REPLICATION_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_REPLICATION_USER
            - name: MYSQL_REPLICATION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_REPLICATION_PASSWORD
            - name: MYSQL_MASTER_HOST
              value: "mysql-primary.flask-mysql.svc.cluster.local"
            - name: MYSQL_MASTER_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD
            # Add these to prevent UUID conflicts
            - name: BITNAMI_DEBUG
              value: "true"
            - name: MYSQL_CLIENT_CREATE_DATABASE_OPTS
              value: ""
          # Improved probes
          readinessProbe:
            exec:
              command:
              - /bin/bash
              - -c
              - |
                # Check basic MySQL connectivity
                if ! mysql -h127.0.0.1 -uroot -p${MYSQL_ROOT_PASSWORD} -e "SELECT 1" > /dev/null 2>&1; then
                  exit 1
                fi
                
                # Check replication status - must have both conditions
                result=$(mysql -h127.0.0.1 -uroot -p${MYSQL_ROOT_PASSWORD} -e "SHOW SLAVE STATUS\G" 2>/dev/null | grep -E "(Slave_IO_Running:|Slave_SQL_Running:)" | tr -d ' ')
                
                io_running=$(echo "$result" | grep "Slave_IO_Running:" | cut -d: -f2)
                sql_running=$(echo "$result" | grep "Slave_SQL_Running:" | cut -d: -f2)
                
                # Only ready if both IO and SQL threads are running
                if [ "$io_running" = "Yes" ] && [ "$sql_running" = "Yes" ]; then
                  exit 0
                else
                  exit 1
                fi
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3

          livenessProbe:
            exec:
              command:
              - /bin/bash
              - -c
              - |
                mysql -h127.0.0.1 -uroot -p${MYSQL_ROOT_PASSWORD} -e "SELECT 1" > /dev/null 2>&1
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          volumeMounts:
            - name: data
              mountPath: /bitnami/mysql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi