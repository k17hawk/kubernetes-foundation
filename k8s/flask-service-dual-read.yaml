apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
  namespace: flask-mysql
spec:
  replicas: 3 
  selector:
    matchLabels: 
      app: flask-app
  template:
    metadata:
      labels:
        app: flask-app
    spec:
      initContainers:
        - name: wait-for-mysql-primary
          image: busybox:1.28
          command: ['sh', '-c', 'until nc -z mysql-primary.flask-mysql.svc.cluster.local 3306; do echo waiting for mysql primary; sleep 2; done;']
        - name: wait-for-mysql-replica
          image: busybox:1.28
          command: ['sh', '-c', 'until nc -z mysql-replica-0.mysql-replica.flask-mysql.svc.cluster.local 3306; do echo waiting for mysql replica; sleep 2; done;']
      
      containers:
        - name: flask-app
          image: my-flask-image:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m 
              memory: 512Mi
          env:
            - name: MYSQL_PRIMARY_HOST
              value: "mysql-primary.flask-mysql.svc.cluster.local"
            - name: MYSQL_REPLICA_SERVICE
              value: "mysql-replica.flask-mysql.svc.cluster.local"
            - name: MYSQL_USER           
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_USER
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_PASSWORD
            - name: MYSQL_DATABASE       
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_DATABASE
            - name: MYSQL_PORT
              value: "3306"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: flask-service
  namespace: flask-mysql
spec:
  selector:
    app: flask-app
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30007
  type: NodePort