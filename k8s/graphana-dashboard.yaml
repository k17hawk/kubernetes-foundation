apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: flask-mysql
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
    - name: 'default'
      orgId: 1
      folder: ''
      type: file
      disableDeletion: false
      editable: true
      updateIntervalSeconds: 10
      allowUiUpdates: true
      options:
        path: /etc/dashboards